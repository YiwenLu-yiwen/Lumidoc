# 添加全局环境变量文件
x-env-file: &env-file
  env_file:
    - ./.env

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - lumidoc_network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  ollama_models:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        ollama pull "$$OLLAMA_CHAT_MODEL"
        ollama pull "$$OLLAMA_EMBEDDING_MODEL"
        ollama list
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:-qwen3:1.7b}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    networks:
      - lumidoc_network
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  db:
    image: ankane/pgvector:latest
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-lumidoc}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./scripts/setup_pgvector.sql:/docker-entrypoint-initdb.d/setup_pgvector.sql
    networks:
      - lumidoc_network

  file_service:
    build:
      context: .
      dockerfile: src/modules/file/Dockerfile
    volumes:
      - ./uploads:/app/uploads
      - ./temp:/app/temp
    environment:
      - PYTHONPATH=/app
      - PDF_PROCESSOR_PATH=/usr/bin
      - UPLOAD_DIR=/app/uploads
      - TEMP_DIR=/app/temp
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-lumidoc}
      - S3_ENDPOINT=http://minio:9000
      - AUTH_SERVICE_URL=http://auth_service:8007
      - PROJECT_SERVICE_URL=http://project_service:8020
      - FILEPROC_SERVICE_URL=http://fileproc_service:8005
    <<: *env-file
    networks:
      - lumidoc_network
    depends_on:
      - db
      - redis
      - minio
      - project_service
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure

  rag_service:
    build:
      context: .
      dockerfile: src/modules/lightraglocal/Dockerfile
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - RAG_DIR=/app/data/rag
      - RAG_INDEX_NAME=main_index
      - DEFAULT_TOP_K=5
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-lumidoc}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_USERNAME=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      - S3_ENDPOINT=http://minio:9000
      - AUTH_SERVICE_URL=http://auth_service:8007
      - FILE_SERVICE_URL=http://file_service:8004
      - PROJECT_SERVICE_URL=http://project_service:8020
      - GATEWAY_URL=http://gateway_service:8888
      - OLLAMA_API_URL=http://ollama:11434
      - OLLAMA_EMBEDDING_URL=http://ollama:11434
      - LLM_MODEL_NAME=${OLLAMA_CHAT_MODEL:-qwen3:1.7b}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - DEFAULT_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - EMBEDDING_DIM=${OLLAMA_EMBEDDING_DIM:-768}
    <<: *env-file
    networks:
      - lumidoc_network
    depends_on:
      - db
      - redis
      - neo4j
      - minio
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
      restart_policy:
        condition: on-failure

  graph_service:
    build:
      context: .
      dockerfile: src/modules/graph/Dockerfile
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - GRAPH_DB_URI=neo4j://neo4j:7687
      - GRAPH_DB_USER=neo4j
      - GRAPH_DB_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      - NEO4J_URI=bolt://neo4j:7687
    volumes:
      - ./data:/app/data/graph
    <<: *env-file
    networks:
      - lumidoc_network
    depends_on:
      - db
      - redis
      - neo4j

  auth_service:
    build:
      context: .
      dockerfile: src/modules/auth/Dockerfile
    environment:
      - PYTHONPATH=/app
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=lumidoc
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-lumidoc}
      - REDIS_HOST=redis
    <<: *env-file
    networks:
      - lumidoc_network
    depends_on:
      - db
      - redis

  project_service:
    build:
      context: .
      dockerfile: src/modules/project/Dockerfile
    <<: *env-file
    environment:
      - PYTHONPATH=/app
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-lumidoc}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-lumidoc}
      - REDIS_HOST=redis
      - AUTH_SERVICE_URL=http://auth_service:8007
    networks:
      - lumidoc_network
    depends_on:
      - db
      - redis

  chat_service:
    build:
      context: .
      dockerfile: src/modules/chat/Dockerfile
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - RAG_DIR=/app/data/rag
      - REDIS_HOST=redis
      - RAG_SERVICE_URL=http://rag_service:8006
      - LLM_SERVICE_URL=http://llm_service:8080
      - GATEWAY_URL=http://gateway_service:8888
      - GRAPH_SERVICE_URL=http://graph_service:8003
      - AUTH_SERVICE_URL=http://auth_service:8007
      - PROJECT_SERVICE_URL=http://project_service:8020
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-lumidoc}
    <<: *env-file
    networks:
      - lumidoc_network
    depends_on:
      - rag_service
      - redis
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
      restart_policy:
        condition: on-failure

  question_service:
    build:
      context: .
      dockerfile: src/modules/question/Dockerfile
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - RAG_DIR=/app/data/rag
      - REDIS_HOST=redis
      - RAG_SERVICE_URL=http://rag_service:8006
      - LLM_SERVICE_URL=http://llm_service:8080
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-lumidoc}
    <<: *env-file
    networks:
      - lumidoc_network
    depends_on:
      - rag_service
      - redis

  monitoring_service:
    build:
      context: .
      dockerfile: src/modules/monitoring/Dockerfile
    environment:
      - AUTH_SERVICE_URL=http://auth_service:8007
      - CHAT_SERVICE_URL=http://chat_service:8001
      - FILE_SERVICE_URL=http://file_service:8004
      - FILEPROC_SERVICE_URL=http://fileproc_service:8005
      - GRAPH_SERVICE_URL=http://graph_service:8003
      - RAG_SERVICE_URL=http://rag_service:8006
      - LLM_SERVICE_URL=http://llm_service:8080
      - MONITORING_SERVICE_URL=http://monitoring_service:8008
      - PROJECT_SERVICE_URL=http://project_service:8020
      - QUESTION_SERVICE_URL=http://question_service:8002
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-lumidoc}
    <<: *env-file
    networks:
      - lumidoc_network
    depends_on:
      - redis

  gateway_service:
    build:
      context: .
      dockerfile: src/modules/gateway/Dockerfile
    ports:
      - "${BIND_HOST:-127.0.0.1}:${GATEWAY_PORT:-8888}:8888"
    environment:
      - PYTHONPATH=/app
      - GATEWAY_PORT=8888
      - REDIS_HOST=redis
      - AUTH_SERVICE_URL=http://auth_service:8007
      - CHAT_SERVICE_URL=http://chat_service:8001
      - FILE_SERVICE_URL=http://file_service:8004
      - FILEPROC_SERVICE_URL=http://fileproc_service:8005
      - GRAPH_SERVICE_URL=http://graph_service:8003
      - RAG_SERVICE_URL=http://rag_service:8006
      - LLM_SERVICE_URL=http://llm_service:8080
      - MONITORING_SERVICE_URL=http://monitoring_service:8008
      - PROJECT_SERVICE_URL=http://project_service:8020
      - QUESTION_SERVICE_URL=http://question_service:8002
    <<: *env-file
    networks:
      - lumidoc_network
    depends_on:
      - project_service
      - file_service
      - rag_service
      - chat_service
      - graph_service
      - auth_service
      - question_service
      - monitoring_service
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    <<: *env-file
    environment:
      - API_GATEWAY_URL=http://localhost:${GATEWAY_PORT:-8888}
      - FRONTEND_URL=http://localhost:${FRONTEND_PORT:-3000}
    networks:
      - lumidoc_network
    depends_on:
      - gateway_service

  fileproc_service:
    build:
      context: .
      dockerfile: src/modules/fileproc/Dockerfile
    volumes:
      - ./uploads:/app/uploads
      - ./temp:/app/temp
    environment:
      - AUTH_SERVICE_URL=http://auth_service:8007
      - PYTHONPATH=/app
      - UPLOAD_DIR=/app/uploads
      - TEMP_DIR=/app/temp
      - FILE_PROCESSING_QUEUE=file_processing
      - REDIS_HOST=redis
      - S3_ENDPOINT=http://minio:9000
      - MINIO_ENDPOINT=minio:9000
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-lumidoc}
      - FILE_SERVICE_URL=http://file_service:8004
      - LLM_SERVICE_URL=http://llm_service:8080
      - GATEWAY_URL=http://gateway_service:8888
      - LLM_POST_PROCESSING_MODEL=${OLLAMA_CHAT_MODEL:-qwen3:1.7b}
      - LLM_CONCURRENT_LIMIT=1
      - PDF_PROCESSOR=local
    <<: *env-file
    networks:
      - lumidoc_network
    depends_on:
      - redis
      - minio
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '${FILEPROC_CPU_LIMIT:-2}'
          memory: ${FILEPROC_MEMORY_LIMIT:-4G}
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    networks:
      - lumidoc_network

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
    volumes:
      - neo4j_data:/data
    networks:
      - lumidoc_network

  minio:
    build:
      context: ./scripts/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    networks:
      - lumidoc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  llm_service:
    build:
      context: .
      dockerfile: src/modules/llm/Dockerfile
    environment:
      - AUTH_SERVICE_URL=http://auth_service:8007
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - LLM_SERVICE_PORT=${LLM_SERVICE_PORT:-8080}
      - LLM_MODEL_TYPE=ollama
      - OLLAMA_NUM_THREADS=${OLLAMA_NUM_THREADS:-4}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-15m}
      - LLM_MODEL_NAME=${OLLAMA_CHAT_MODEL:-qwen3:1.7b}
      - OLLAMA_API_URL=http://ollama:11434
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_EMBEDDING_URL=http://ollama:11434
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - DEFAULT_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    <<: *env-file
    networks:
      - lumidoc_network
    depends_on:
      redis:
        condition: service_started
      ollama_models:
        condition: service_completed_successfully
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
      restart_policy:
        condition: on-failure

networks:
  lumidoc_network:
    driver: bridge

volumes:
  db_data:
  redis_data:
  neo4j_data:
  minio_data:
  ollama_data:
