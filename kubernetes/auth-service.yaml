apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
    part-of: stp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: stp/auth-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8007
        env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: stp-config
              key: DATABASE_URL
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: stp-secrets
              key: JWT_SECRET_KEY
        - name: JWT_PRIVATE_KEY_PATH
          value: "/app/src/modules/auth/key/jwt_private_key.pem"
        - name: JWT_PUBLIC_KEY_PATH
          value: "/app/src/modules/auth/key/jwt_public_key.pem"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8007
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8007
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 8007
      targetPort: 8007
  type: ClusterIP 