# Auto-selected native Ollama (Apple Silicon Metal, or another host GPU runtime).
# Use: ./start_services.sh --native
services:
  ollama:
    profiles: [docker-models]
  ollama_models:
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: !reset {}
    environment:
      - OLLAMA_HOST=${NATIVE_OLLAMA_URL:-http://host.docker.internal:11434}
  llm_service:
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      - OLLAMA_API_URL=${NATIVE_OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_URL=${NATIVE_OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_EMBEDDING_URL=${NATIVE_OLLAMA_URL:-http://host.docker.internal:11434}
  rag_service:
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      - OLLAMA_API_URL=${NATIVE_OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_EMBEDDING_URL=${NATIVE_OLLAMA_URL:-http://host.docker.internal:11434}
